version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: chacha-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=chachadb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartganga-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chacha-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - FLASK_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/chachadb
      - SECRET_KEY=${SECRET_KEY:-cha-cha-ganga-production-secret-key-change-me}
      - CORS_ORIGINS=http://localhost,http://localhost:5173,http://localhost:80
      - TTS_PROXY_URL=http://tts-proxy:6001
      - ENABLE_LOCAL_LLM=${ENABLE_LOCAL_LLM:-false}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/Data:/workspace/backend/Data
      - ./backend/voices:/workspace/backend/voices
    networks:
      - smartganga-network

  tts-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chacha-tts
    restart: unless-stopped
    ports:
      - "6001:6001"
    command: ["python3", "/workspace/backend/tts_proxy.py", "--port", "6001"]
    environment:
      - TTS_PORT=6001
      - TTS_ENGINE=piper
    volumes:
      - ./backend/piper:/workspace/backend/piper
      - ./backend/voices:/workspace/backend/voices
    networks:
      - smartganga-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chacha-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
      - VITE_TTS_BASE_URL=http://localhost:6001
    depends_on:
      - backend
      - tts-proxy
    networks:
      - smartganga-network

volumes:
  mongodb_data:

networks:
  smartganga-network:
    driver: bridge

